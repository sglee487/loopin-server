server:
  port: ${SERVER_PORT:59003}
  shutdown: graceful
  netty:
    connection-timeout: 2s
    idle-timeout: 30s

spring:
  application:
    name: streaming-service
  config:
    import: "optional:kubernetes:"
  main:
    web-application-type: reactive
    allow-bean-definition-overriding: true
  lifecycle:
    timeout-per-shutdown-phase: 15s
  r2dbc:
    username: user
    password: password
    url: r2dbc:postgresql://${DB_HOST:localhost}:54322/loopin_streaming
    pool:
      max-create-connection-time: 2s
      initial-size: 5
      max-size: 10
  flyway:
    user: ${spring.r2dbc.username}
    password: ${spring.r2dbc.password}
    url: jdbc:postgresql://${DB_HOST:localhost}:54322/loopin_streaming
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${ISSUER_URI:http://localhost:59022/realms/loopin}

logging:
  pattern:
    level: "%5p [${spring.application.name},%X{trace_id},%X{span_id}]"
  level:
    com.loopin.streaming_service: debug
  exception-conversion-word: "%ex{10}"

streaming:
  base-url: ${BASE_URL:http://localhost:59000}

management:
  endpoints:
    web:
      exposure:
        include: configprops, env, health, heapdump, info, loggers, mappings, prometheus
  endpoint:
    health:
      show-details: always
      show-components: always
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState
  info:
    env:
      enabled: true
    java:
      enabled: true
    os:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}