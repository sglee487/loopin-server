listen              1935;
max_connections     1000;
srs_log_tank        console;
#srs_log_level       trace;
daemon              off;

http_api {
  enabled on;
  listen 1985;
}

http_server {
  enabled on;
  listen 8080;
  dir /usr/local/srs/objs/nginx/html;           # 절대경로
}

vhost __defaultVhost__ {
  hls {
    enabled on;
    hls_path /usr/local/srs/objs/nginx/html;    # 절대경로
    hls_fragment 4;
    hls_window 12;

    # 컨텍스트 파일명 끄기(고정 URL)
    hls_ctx off;
    hls_ts_ctx off;

    # 보기 좋은 디렉터리형 출력
    hls_m3u8_file [app]/[stream]/index.m3u8;
    hls_ts_file   [app]/[stream]/[seq].ts;

    hls_acodec aac;
    hls_vcodec h264;
    hls_cleanup on;
    hls_dispose 120;
    hls_wait_keyframe on;
  }

  # ★ 특정 app(live)에만 트랜스코딩 적용
  transcode live {
    enabled on;
    ffmpeg /usr/local/srs/objs/ffmpeg/bin/ffmpeg;  # 또는 /usr/bin/ffmpeg

    engine 1080p {
      enabled on;
      iformat flv;
      vcodec libx264; vbitrate 5000; vfps 60; vwidth 1920; vheight 1080;
      vprofile main; vpreset veryfast;
      acodec aac; abitrate 192; asample_rate 44100; achannels 2;
      oformat flv;
      output rtmp://127.0.0.1:[port]/abr/[app]?vhost=[vhost]/[stream]_1080p;
    }

    engine 720p {
      enabled on;
      iformat flv;
      vcodec libx264; vbitrate 2800; vfps 60; vwidth 1280; vheight 720;
      vprofile main; vpreset veryfast;
      acodec aac; abitrate 128; asample_rate 44100; achannels 2;
      oformat flv;
      # v6 문서의 정식 문법(출력 URL 템플릿)
      output rtmp://127.0.0.1:[port]/abr/[app]?vhost=[vhost]/[stream]_720p;
    }

    engine 480p {
      enabled on;
      iformat flv;
      vcodec libx264; vbitrate 1400; vfps 30; vwidth 854; vheight 480;
      vprofile main; vpreset veryfast;
      acodec aac; abitrate 96; asample_rate 44100; achannels 2;
      oformat flv;
      output rtmp://127.0.0.1:[port]/abr/[app]?vhost=[vhost]/[stream]_480p;
    }

    engine 360p {
      enabled on;
      iformat flv;
      vcodec libx264; vbitrate 800; vfps 30; vwidth 640; vheight 360;
      vprofile main; vpreset veryfast;
      acodec aac; abitrate 64; asample_rate 44100; achannels 2;
      oformat flv;
      output rtmp://127.0.0.1:[port]/abr/[app]?vhost=[vhost]/[stream]_360p;
    }
  }

  # 2) HTTP 콜백(=webhook) — vhost 내부에 둬야 함
  exec {
    enabled on;

    # 스트림 시작 시 마스터 M3U8 생성
    publish /usr/local/srs/scripts/generate_master.sh [vhost] [app] [stream];

    # 스트림 종료 시 정리(원하면 켜세요)
    # unpublish /usr/local/srs/scripts/generate_master.sh --cleanup [vhost] [app] [stream];
  }
}
