listen              1935;
max_connections     1000;
srs_log_tank        console;
#srs_log_level       trace;
daemon              off;

http_api {
  enabled on;
  listen 1985;
}

http_server {
  enabled on;
  listen 8080;
  dir /usr/local/srs/objs/nginx/html;           # 절대경로
}

vhost __defaultVhost__ {
  hls {
    enabled on;
    hls_path /usr/local/srs/objs/nginx/html;    # 절대경로
    hls_fragment 4;
    hls_window 20;

    # 컨텍스트 파일명 끄기(고정 URL)
    hls_ctx off;
    hls_ts_ctx off;

    # 보기 좋은 디렉터리형 출력
    hls_m3u8_file [app]/[stream]/index.m3u8;
    hls_ts_file   [app]/[stream]/[seq].ts;

    hls_acodec aac;
    hls_vcodec h264;
    hls_cleanup on;
    hls_dispose 120;
    hls_wait_keyframe on;
  }

  # ★ 서버 자원 최적화된 2단계 화질 설정 (720p, 360p)
  transcode live {
    enabled on;
    ffmpeg /usr/local/srs/objs/ffmpeg/bin/ffmpeg;

    engine 720p {
      enabled on;
      iformat flv;
      vcodec libx264; vbitrate 1750; vfps 30; vwidth 1280; vheight 720;
      vparams { g 120; sc_threshold 0; }
      vprofile main; vpreset veryfast;
      acodec aac; abitrate 128; asample_rate 44100; achannels 2;
      oformat flv;
      output rtmp://127.0.0.1:[port]/abr/[app]?vhost=[vhost]/[stream]_720p;
    }

    engine 360p {
      enabled on;
      iformat flv;
      vcodec libx264; vbitrate 300; vfps 30; vwidth 640; vheight 360;
      vparams { g 60; sc_threshold 0; }
      vprofile main; vpreset fast;
      acodec aac; abitrate 64; asample_rate 44100; achannels 2;
      oformat flv;
      output rtmp://127.0.0.1:[port]/abr/[app]?vhost=[vhost]/[stream]_360p;
    }
  }

  http_hooks {
    enabled on;

    # 발행 시 인증 (여기에서 ?key= 를 검증)
    on_publish  http://host.docker.internal:59003/api/v1/hooks/on_publish;

    # 선택: 종료/재생 시 로깅이나 정리
    on_unpublish  http://host.docker.internal:59003/api/v1/hooks/on_unpublish;
    # on_play 등도 필요시 추가
  }
}
