version: "3.8"
name: loopin-system

services:
  # Application Services
  gateway-service:
    profiles: ["app", "all"]
    depends_on:
      - gateway-redis
      - tempo
    container_name: gateway-service
    image: gateway-service
#    pull_policy: always
    ports:
      - 59000:8080
    environment:
      JAVA_TOOL_OPTIONS: "-javaagent:/workspace/BOOT-INF/lib/opentelemetry-javaagent-2.18.1.jar"
      OTEL_SERVICE_NAME: "gateway-service"
      OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://tempo:4317"
      OTEL_METRICS_EXPORTER: "none"
      OTEL_LOGS_EXPORTER: "none"
      SERVER_PORT: 8080
      PLAYBACK_SERVICE_URL: http://playback-service:8080
      MEDIA_CATALOG_SERVICE_URL: http://media-catalog-service:8080
      STREAMING_SERVICE_URL: http://streaming-service:8080
      ISSUER_URI: http://keycloak:8080/realms/loopin
      REDIRECT_URL: http://localhost:11420
      REDIS_HOST: gateway-redis
      REDIS_PORT: 6379
    logging:
      driver: fluentd
      options:
        fluentd-address: 127.0.0.1:24224

  media-catalog-service:
    profiles: ["app", "all"]
    depends_on:
      - loopin-postgres
      - media-catalog-redis
      - tempo
    container_name: media-catalog-service
    image: media-catalog-service
#    pull_policy: always
    ports:
      - 59001:8080
    environment:
      JAVA_TOOL_OPTIONS: "-javaagent:/workspace/BOOT-INF/lib/opentelemetry-javaagent-2.18.1.jar"
      OTEL_SERVICE_NAME: "media-catalog-service"
      OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://tempo:4317"
      OTEL_METRICS_EXPORTER: "none"
      OTEL_LOGS_EXPORTER: "none"
      SERVER_PORT: 8080
      REDIS_HOST: media-catalog-redis
      REDIS_PORT: 6379
      DB_HOST: loopin-postgres
      ISSUER_URI: http://keycloak:8080/realms/loopin
      YOUTUBE_FETCHER_SERVICE_URL: http://youtube-fetcher-service:8080
    logging:
      driver: fluentd
      options:
        fluentd-address: 127.0.0.1:24224

  playback-service:
    profiles: ["app", "all"]
    depends_on:
      - loopin-postgres
      - tempo
    container_name: playback-service
    image: playback-service
#    pull_policy: always
    ports:
      - 59002:8080
    environment:
      JAVA_TOOL_OPTIONS: "-javaagent:/workspace/BOOT-INF/lib/opentelemetry-javaagent-2.18.1.jar"
      OTEL_SERVICE_NAME: "playback-service"
      OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://tempo:4317"
      OTEL_METRICS_EXPORTER: "none"
      OTEL_LOGS_EXPORTER: "none"
      SERVER_PORT: 8080
      DB_HOST: loopin-postgres
      ISSUER_URI: http://keycloak:8080/realms/loopin
      MEDIA_CATALOG_SERVICE_URL: http://media-catalog-service:8080
    logging:
      driver: fluentd
      options:
        fluentd-address: 127.0.0.1:24224

  youtube-fetcher-service:
    profiles: ["app", "all"]
    depends_on:
      - tempo
    container_name: youtube-fetcher-service
    image: youtube-fetcher-service
#    pull_policy: always
    ports:
      - 59011:8080
    env_file:
      - ../../youtube-fetcher-service/.env
    environment:
      JAVA_TOOL_OPTIONS: "-javaagent:/workspace/BOOT-INF/lib/opentelemetry-javaagent-2.18.1.jar"
      OTEL_SERVICE_NAME: "youtube-fetcher-service"
      OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://tempo:4317"
      OTEL_METRICS_EXPORTER: "none"
      OTEL_LOGS_EXPORTER: "none"
      SERVER_PORT: 8080
    logging:
      driver: fluentd
      options:
        fluentd-address: 127.0.0.1:24224

  streaming-service:
    profiles: ["app", "all"]
    depends_on:
      - loopin-postgres
      - streaming-redis
      - tempo
      - srs-server
    container_name: streaming-service
    image: streaming-service
#    pull_policy: always
    ports:
      - 59003:8080
    environment:
      JAVA_TOOL_OPTIONS: "-javaagent:/workspace/BOOT-INF/lib/opentelemetry-javaagent-2.18.1.jar"
      OTEL_SERVICE_NAME: "streaming-service"
      OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://tempo:4317"
      OTEL_METRICS_EXPORTER: "none"
      OTEL_LOGS_EXPORTER: "none"
      SERVER_PORT: 8080
      REDIS_HOST: streaming-redis
      REDIS_PORT: 6379
      DB_HOST: loopin-postgres
      ISSUER_URI: http://keycloak:8080/realms/loopin
      STREAMING_STORAGE_PATH: /app/streams
      SRS_SERVER_URL: http://srs-server:1985
    volumes:
      - ./streams:/app/streams
    logging:
      driver: fluentd
      options:
        fluentd-address: 127.0.0.1:24224

  nginx-accel:
    profiles: ["streaming", "all"]
    image: nginx:stable
    container_name: nginx-accel
    ports:
      - "59103:80"
    volumes:
      - ./hls-accel/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./srs-hls:/hlsroot:ro     # SRS HLS 디렉터리 공유
#    depends_on:
#      - streaming-service

  srs-server:
    profiles: ["streaming", "all"]
    image: ossrs/srs:6
    container_name: srs-server
    ports:
      - "1935:1935"    # RTMP port
      - "8080:8080"    # HTTP API and HLS
      - "1985:1985"    # HTTP API
    environment:
      - SRS_DAEMON=off
    volumes:
      - ./srs/srs.conf:/usr/local/srs/conf/srs.conf
#      - ./streams:/usr/local/srs/objs/nginx/html
      - ./srs/generate_master.sh:/usr/local/srs/scripts/generate_master.sh
      - ./logs:/usr/local/srs/objs/logs  # 로그 디렉토리 추가
      - ./srs-hls:/usr/local/srs/objs/nginx/html
    command: ["./objs/srs", "-c", "/usr/local/srs/conf/srs.conf"]

  # Infrastructure Services
  keycloak:
    profiles: ["infra", "all"]
    image: quay.io/keycloak/keycloak:26.2.5
    container_name: keycloak
    command: start-dev --import-realm
    depends_on:
      - keycloak-postgres
    volumes:
      - ./keycloak:/opt/keycloak/data/import
    environment:
      - KEYCLOAK_ADMIN=user
      - KEYCLOAK_ADMIN_PASSWORD=password
      - KC_DB=postgres
      - KC_DB_URL=jdbc:postgresql://keycloak-postgres:5432/keycloak
      - KC_DB_USERNAME=keycloak
      - KC_DB_PASSWORD=password
    ports:
      - 59022:8080

  loopin-postgres:
    profiles: ["infra", "all"]
    image: "postgres:14.12"
    container_name: loopin-postgres
    ports:
      - 54322:5432
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
    volumes:
      - ./postgresql/init.sql:/docker-entrypoint-initdb.d/init.sql

  keycloak-postgres:
    profiles: ["infra", "all"]
    image: "postgres:14.12"
    container_name: keycloak-postgres
    environment:
      - POSTGRES_DB=keycloak
      - POSTGRES_USER=keycloak
      - POSTGRES_PASSWORD=password
    volumes:
      - ./postgresql/keycloak-data:/var/lib/postgresql/data
    ports:
      - 5433:5432 # Use a different port to avoid conflict with loopin-postgres

  gateway-redis:
    profiles: ["infra", "all"]
    image: "redis:8.0.2"
    container_name: gateway-redis
    ports:
      - 6379:6379

  media-catalog-redis:
    profiles: ["infra", "all"]
    image: "redis:8.0.2"
    container_name: media-catalog-redis
    ports:
      - 56371:6379

  # Observability Services
  fluent-bit:
    profiles: ["observability", "all"]
    image: grafana/fluent-bit-plugin-loki:3.5.3
    container_name: fluent-bit
    ports:
      - "24224:24224"
    environment:
      - LOKI_URL=http://loki:3100/loki/api/v1/push
    volumes:
      - ./observability/fluent-bit/fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf

  loki:
    profiles: ["observability", "all"]
    image: grafana/loki:3.5.3
    container_name: loki
    depends_on:
      - fluent-bit
    ports:
      - "3100:3100"

  prometheus:
    profiles: ["observability", "all"]
    image: quay.io/prometheus/prometheus:v3.5.0
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml

  tempo:
    profiles: ["observability", "all"]
    image: grafana/tempo:2.8.1
    container_name: tempo
    command: -config.file=/etc/tempo-config.yml
    ports:
      - "3200:3200"   # OTLP
      - "4317:4317"   # OTLP
      - "4318:4318"   # HTTP
      - "9095:9095"   # rpc
    volumes:
      - ./observability/tempo/tempo.yml:/etc/tempo-config.yml

  grafana:
    profiles: ["observability", "all"]
    image: grafana/grafana-oss:12.1.0
    container_name: grafana
    depends_on:
      - loki
      - prometheus
      - tempo
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=user
      - GF_SECURITY_ADMIN_PASSWORD=password
    volumes:
      - ./observability/grafana/datasources:/etc/grafana/provisioning/datasources
      - ./observability/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./observability/grafana/grafana.ini:/etc/grafana/grafana.ini
