server {
  listen 80;
  server_name _;

  # 공개 진입점: 앱으로 프록시 (m3u8 리라이트/권한 + X-Accel-Redirect 반환)
  location /api/v1/streams {
    proxy_pass http://host.docker.internal:59003;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # 내부 전용: 실제 HLS 파일을 직접 전송
  location /_internal/hls/ {
    internal;              # 클라 직접 접근 차단
    alias /hlsroot/;       # <- srs-hls 볼륨이 여기에 마운트됨
    sendfile on;
    tcp_nopush on;

    # CORS(필요시)
    add_header Access-Control-Allow-Origin "*";
    # MIME 타입만 설정
    types { application/vnd.apple.mpegurl m3u8; video/mp2t ts; application/octet-stream m4s; }
  }

  location /public-hls/ {
    alias /hlsroot/;
    sendfile on;
    tcp_nopush on;

    # CORS
    add_header Access-Control-Allow-Origin "*";

    # MIME types
    location ~* \.m3u8$ {
        add_header Content-Type application/vnd.apple.mpegurl;
        expires -1;
    }

    location ~* \.ts$ {
        add_header Content-Type video/mp2t;
        expires 1h;
    }
  }

}
